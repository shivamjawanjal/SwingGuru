name: Daily Trading Engine Update

on:
  schedule:
    # Runs Monday through Friday at 14:30 UTC (8:00 PM IST)
    - cron: '30 14 * * 1-5'
  workflow_dispatch: # Allows manual trigger from GitHub Actions UI

permissions:
  contents: write # Needed to push portfolio state changes back

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Daily Portfolio Update & Scan
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          # Runs daily checks, exits, buys and sends Telegram notifications
          python run_paper_trading.py --update

      - name: Commit and Push Portfolio State Changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/paper_trading/state.json data/paper_trading/equity_history.csv
          if ! git diff --cached --quiet; then
            git commit -m "Auto-update portfolio state [skip ci]"
            git push
          else
            echo "No state changes to commit."
          fi
